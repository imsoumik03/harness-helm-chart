image:
  registry: docker.io
  repository: harness/tsdb-to-psql-migrator-signed
  tag: 1.0.0-soumik-migration-5-bc3b0b
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  digest: ""
  # image pull secrets to use for batch-processing image
  imagePullSecrets: []
timescaleSecret:
  password:
    name: harness-secrets
    key: timescaledbPostgresPassword
smtp:
  host: ""
  password: ""
  user: ""
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: "tsdb-to-psql-migrator"
podAnnotations: {}
# Pod-level security context - sets ownership for mounted volumes
# fsGroup: 1000 ensures PVC is writable by user 1000
podSecurityContext:
  fsGroup: 1000 # Sets group ownership of mounted volumes
  runAsUser: 1000 # Run pod as user 1000 (non-root)
  runAsGroup: 1000 # Run pod as group 1000
  fsGroupChangePolicy: "OnRootMismatch" # Only change permissions when needed (performance)
# Container-level security context
securityContext:
  allowPrivilegeEscalation: false # Prevent privilege escalation
  runAsNonRoot: true # Force non-root execution
  runAsUser: 1000 # Run as user 1000 (matches migration user in Dockerfile)
  capabilities:
    drop:
      - ALL # Drop all capabilities for security
nodeSelector: {}
tolerations: []
affinity: {}
resources:
  limits:
    memory: "1536Mi"
  requests:
    cpu: 1
    memory: "512Mi"
additionalConfigs: {}
postgres:
  ## - protocol to use for connection
  enabled: false
  ## - host array for external
  hosts: []
  extraArgs: ""
  secrets:
    kubernetesSecrets:
      - secretName: ""
        keys:
          POSTGRES_USER: ""
          POSTGRES_PASSWORD: ""
    secretManagement:
      externalSecretsOperator:
        - secretStore:
            name: ""
            kind: ""
          remoteKeys:
            POSTGRES_USER:
              name: ""
              property: ""
            POSTGRES_PASSWORD:
              name: ""
              property: ""
