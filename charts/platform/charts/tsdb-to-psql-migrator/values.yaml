  conditions: {}
  default: {}
  kubernetesSecrets: []
  secretManagement:
    externalSecretsOperator: []
config: {}
extraEnvVars:
  - name: MIGRATION_ENABLED
    value: "false"
  - name: MAX_PARALLEL_JOBS
    value: "8"
  - name: RESTORE_PARALLEL_WORKERS
    value: "8"
  - name: DUMP_COMPRESSION_LEVEL
    value: "7"
  - name: MAX_RETRIES
    value: "3"
  - name: RETRY_DELAY_SECONDS
    value: "30"
  - name: SKIP_SCHEMA_EXTRACT
    value: "false"
  - name: SKIP_FUNCTION_RECREATION
    value: "false"
  - name: SKIP_HYPERTABLE_RECREATION
    value: "false"
  - name: SKIP_CRONJOB_CREATION
    value: "false"
  - name: SKIP_DUMP
    value: "false"
  - name: SKIP_RESTORE
    value: "false"
  - name: SKIP_HYPER_TABLE_MIGRATION
    value: "false"
  - name: SKIP_VALIDATION
    value: "false"
  - name: SKIP_ENDPOINT_UPDATE
    value: "false"
  - name: SKIP_INCREMENTAL_SYNC
    value: "false"
  - name: SKIP_CUTOVER_FULL_COPY
    value: "false"
